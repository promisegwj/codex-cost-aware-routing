# Project-owned routing controls for codex-workflow.
# Workflow policy; scripts/select_route.py reads the two-axis sections for route advice.
# The selector does not dispatch agents or change the current chat model.
# Do not merge these custom keys into global Codex config.toml.

[routing]
max_scouts = 1
max_worker_attempts = 1
# One attempt per selected profile; total budget is in adaptation_policy.
max_rework_passes = 1
max_review_rounds = 1
output_style = "concise"
prefer_static_preroute = true
require_failure_packet_after_failed_attempt = true
enforcement_mode = "mandatory_boundary_roles_all_tiers_hard_T3_T4_managed_T2"
require_route_evidence = true
require_route_ledger = true
require_all_child_contexts_in_evidence = true
require_execution_context_discovery = true
require_reuse_gate_before_spawn = true
require_evidence_source = true
require_substitution_packet = true
goal_mode_is_route_evidence = false
preauthorize_hard_routing = true
allow_main_agent_role_collapse = false
allow_degraded_manual_route = false
allow_main_agent_write_substitution = "failed_or_blocked_or_timeout_or_abandoned_or_closed_with_unusable_output_or_user_degraded_execution"
fallback_if_no_execution_context = "route_blocked"
managed_route_tiers = ["T2"]
hard_route_tiers = ["T3", "T4"]
strategy = "completion_first_with_cost_guardrails"
hard_route_evidence_required_fields = ["child_id", "parent_id_if_visible", "thread_source", "evidence_source", "agent_role", "status", "adoption_reason"]
compact_route_evidence_required_fields = ["route_decision", "spawned_children_if_any", "model_effort_source", "validation_result", "frontier_escalation_decision", "specialist_gate_decision", "selected_profile", "failure_class_if_any", "transition_evidence_if_any", "attempt_budget_used"]
model_effort_role_config_label = "routing-controls execution_profiles selection + model_roles baseline"
goal_mode_note = "Goal mode and Goal-mode are continuation or handoff wrappers, not route evidence."
t2_t3_default_child_budget = 3
# Planner + one writer + final reviewer; optional discovery needs an expansion packet.

[root_default]
role = "root_direct"
model = "gpt-6.1-sol"
model_reasoning_effort = "low"
reason = "Sol low is the normal default; Luna medium only for evidenced trivial deterministic execution"

[model_roles.batch_worker]
model = "gpt-6-luna"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
availability_gate = true
fallback_role = "worker_standard"
notes = "Only evidenced trivial deterministic low-risk execution; no diagnosis, design, ambiguity or substantive reasoning. Availability gate required; otherwise Sol low."

[model_roles.explorer]
model = "gpt-6.1-sol"
model_reasoning_effort = "low"
sandbox_mode = "read-only"
notes = "Read-only discovery requires judgment and uses Sol low or above."

[model_roles.worker_standard]
model = "gpt-6.1-sol"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
notes = "Default bounded T2 writer. Sol low baseline; integrated or multistep work uses worker_sol."

[model_roles.worker_sol]
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
notes = "Intermediate T2 writer for multi-module, multi-file, or reasoning-heavy implementation that requires integrated or multistep reasoning without a critical-risk trigger."
[model_roles.worker_frontier]
model = "gpt-6-astra"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
notes = "Use for deterministic T2 escalation, T3 implementation, and default T4 milestone execution."

[model_roles.reviewer_risk]
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
notes = "Cost-aware independent review for T2 escalations. T3/T4 and critical-risk review uses reviewer_frontier."

[model_roles.reviewer_frontier]
model = "gpt-6-astra"
model_reasoning_effort = "low"
sandbox_mode = "read-only"
notes = "Independent review for T3/T4 and critical-risk changes; do not use for routine T2 reviews."
[model_roles.planner_frontier]
model = "gpt-6-astra"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
notes = "Mandatory independent initial planner for every T0-T4 task, including trivial execution. High floor by user policy, not specialist authorization."

[model_roles.reviewer_final]
model = "gpt-6-astra"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
notes = "Mandatory independent final reviewer for every T0-T4 task after validation. High floor, including trivial execution."

[model_roles.reasoning_specialist]
model = "gpt-6-astra"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
availability_gate = true
automatic_tier_route = false
notes = "Exceptional bounded reasoning or planning specialist only after the GPT-6 gate passes. The existing writer implements its result."

[preferred_roles]
t0_worker = "root_direct"
t1_worker = "root_direct"
t1_reviewer = "reviewer_final"
t2_explorer = "explorer"
t2_worker = "worker_standard"
t2_sol_worker = "worker_sol"
t2_frontier_worker = "worker_frontier"
t2_reviewer = "reviewer_risk"
t3_explorer = "explorer"
t3_worker = "worker_frontier"
t3_reviewer = "reviewer_frontier"
t4_planner = "planner_frontier"
t4_worker = "worker_frontier"
t4_milestone_reviewer = "reviewer_frontier"
t4_final_reviewer = "reviewer_final"
batch_worker = "batch_worker"
exceptional_reasoning_specialist = "reasoning_specialist"
legacy_worker_55_alias = "worker_55"
legacy_planner_55_alias = "planner_55"

[tier_defaults]
T0 = "planner_frontier -> root_direct or eligible batch_worker -> validation -> reviewer_final"
T1 = "planner_frontier -> root_direct or eligible batch_worker -> validation -> reviewer_final"
T2 = "planner_frontier -> managed Sol writer -> validation -> optional risk review -> reviewer_final"
T3 = "planner_frontier -> worker_frontier -> validation -> reviewer_frontier -> reviewer_final; required four roles need recorded budget expansion beyond three"
T4 = "planner_frontier -> authorized staged execution -> milestone validation and reviewer_frontier -> reviewer_final"

[boundary_policy]
all_tiers = ["T0", "T1", "T2", "T3", "T4"]
initial_planner = "planner_frontier"
final_reviewer = "reviewer_final"
minimum_model = "gpt-6-astra"
minimum_reasoning_effort = "high"
independent_contexts_required = true
trivial_execution_exemption = false
fallback_if_unavailable = "route_blocked"
existing_authorization_suffices = true

[luna_policy]
only_profile = "luna_medium"
require_trivial_execution_flag = true
require_execution_evidence = true
eligibility = "bounded low-risk deterministic execution without diagnosis, design, ambiguity or substantive reasoning; no shared config, engineering, architecture or critical risk"
ineligible_fallback_profile = "sol_low"

[t2_policy]
managed_conditional = true
require_compact_evidence = true
default_worker = "worker_standard"
intermediate_worker = "worker_sol"
intermediate_worker_triggers = ["semantic coupling across modules", "nontrivial domain reasoning", "unresolved task ambiguity after targeted discovery"]
frontier_escalation_worker = "worker_frontier"
frontier_escalation_effort = "low"
reviewer_when_escalated = "reviewer_risk"
reviewer_when_frontier_escalated = "reviewer_frontier"
frontier_escalation_triggers = [
  "security_auth_permissions_payments_privacy_or_encryption",
  "data_loss_data_consistency_or_migration_risk",
  "public_api_schema_contract_or_backward_compatibility_risk",
  "unresolved_implementation_failure_with_potential_high_consequence",

  "user_explicitly_requests_frontier_model",
  "reviewer_or_validator_finds_high_severity_issue",
  "demonstrated_assigned_model_limit_under_adaptation_policy",
]
compact_evidence_note = "For T2, record the decision, any spawned child ids, validation result, and why frontier capability was or was not triggered; full route ledgers are still allowed."

[selection_policy]
version = "2026-10-07-sol-default-astra-high-boundaries-v2"
selector = "skills/codex-workflow/scripts/select_route.py"
separate_workflow_tier_model_and_effort = true
file_count_alone_upgrades_model = false
high_confidence_alone_upgrades_model = false
critical_risk_minimum_tier = "T3"
critical_risk_model = "gpt-6-astra"
bounded_t2_profile = "sol_low"
integrated_t2_profile = "sol_medium"
dense_reasoning_profile = "sol_high"
frontier_default_profile = "astra_low"
frontier_coupled_profile = "astra_medium"
planner_profile = "astra_high"
final_review_profile = "astra_high"
root_model_rule = "config.toml is a default, not actual-session evidence; record the selected runtime model and effort. Do not silently switch the user's chosen root model."
high_confidence_rule = "Strengthen acceptance criteria, focused validation, and independent review; use model or effort escalation only with a capability or reasoning reason."
invocation_rule = "Use the registered semantic role only when its actual model/effort matches the selected profile. Otherwise use a default child with explicit model/effort, bounded context, complete role instructions, ownership, acceptance criteria and recorded enforcement. Never count advice as executed routing."

[execution_profiles.luna_medium]
model = "gpt-6-luna"
model_reasoning_effort = "medium"
[execution_profiles.sol_low]
model = "gpt-6.1-sol"
model_reasoning_effort = "low"
[execution_profiles.sol_medium]
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
[execution_profiles.sol_high]
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
[execution_profiles.astra_low]
model = "gpt-6-astra"
model_reasoning_effort = "low"
[execution_profiles.astra_medium]
model = "gpt-6-astra"
model_reasoning_effort = "medium"
[execution_profiles.astra_high]
model = "gpt-6-astra"
model_reasoning_effort = "high"

[adaptation_policy]
max_automatic_transitions = 2
max_total_writer_attempts_per_acceptance = 3
require_failure_class_and_evidence = true
failure_classes = ["none", "context", "instructions", "tool", "environment", "capacity", "validation_defect", "effort_limit", "capability_limit"]
non_reasoning_failures = ["context", "instructions", "tool", "environment", "capacity", "validation_defect"]
non_reasoning_action = "Repair the identified cause or apply recorded availability fallback; do not increase reasoning or open the specialist gate. Re-score tier if new critical risk is discovered."
effort_limit_evidence = "Task and assumptions were understood; required context/tools worked; a specific missed derivation, alternative, or constraint is demonstrated. One next-effort attempt on the same acceptance criteria."
capability_limit_evidence = "Persistent misunderstanding, wrong abstraction, domain or tool-planning limits, or coupled/novel work exceeding the assigned model; explain why extra effort is unlikely to fix it."
sol_low_effort_next = "sol_medium"
sol_medium_effort_next = "sol_high"
sol_high_effort_next = "astra_medium"
luna_medium_effort_next = "sol_medium"
astra_low_effort_next = "astra_medium"
astra_medium_effort_next = "astra_high"
astra_high_effort_next = "stop_and_handoff"
luna_capability_next = "sol_medium"
sol_capability_next = "astra_medium"
astra_capability_next = "stop_or_gated_specialist"
high_effort_initial_rule = "Sol high may be selected for bounded dense reasoning only with named constraint/derivation evidence. Initial planning and final review require Astra high by user policy; implementation/specialist Astra high requires demonstrated medium inadequacy."
extreme_effort_rule = "xhigh/max/ultra only with explicit user request and exact runtime support; no automatic route."
budget_exhaustion_rule = "Stop new writing attempts, preserve progress and return a failure/continuation packet; extra budget requires explicit user authorization."

[economics_feedback]
optimize = "total effort to an accepted result, including retries and handoffs"
observation_fields = ["task_class", "tier", "role", "actual_model", "actual_effort", "acceptance_result", "rework_count", "elapsed_seconds", "token_usage_if_available", "codex_usage_if_available", "cost_source", "validation_coverage"]
missing_usage_rule = "Record unavailable; never estimate subscription consumption from API prices."
downgrade_scope = "future independent tasks in the same task class, never an unfinished high-risk task"
minimum_observations_before_candidate = 5
candidate_rule = "Five comparable accepted runs without substantive rework permit a one-step lower-effort candidate within Sol low and boundary Astra high floors; Luna requires trivial execution eligibility; verify the same acceptance criteria and restore the prior profile on regression. This is a policy heuristic, not benchmark proof."
automatic_global_policy_rewrite = false

[exceptional_reasoning_policy]
enabled = true
role = "reasoning_specialist"
default_model = "gpt-6-astra"
default_reasoning_effort = "medium"
scope = "one bounded read-only reasoning or planning subproblem"
writer_after_specialist = "existing assigned writer"
require_gate_evidence = true
allowed_gate_paths = [
  "explicit_ultra_hard_coupling_or_novel_reasoning_with_evidence_current_assigned_route_is_insufficient",
  "failure_packet_demonstrates_assigned_route_failed_due_to_reasoning_limit_not_tool_environment_or_capacity",
]
automatic_non_triggers = [
  "tier_T3_or_T4_alone",
  "security_or_risk_alone",
  "many_files_alone",
  "user_requests_high_confidence_alone",
  "model_capacity_or_availability_error",
]
default_invocation = "registered reasoning_specialist agent"
unregistered_role_fallback = "after_gate_only: default child with explicit gpt-6-astra medium, bounded context, actual restriction inspection, and read-only no-file-change handoff prompt"
fallback_read_only_enforcement_values = ["sandbox", "prompt_only"]
prompt_only_is_hard_isolation = false
route_blocked_if_enforced_read_only_required_but_unavailable = true
availability_rule = "unavailable does not bypass the gate, justify another GPT-6 model, or count as a assigned-route reasoning failure"
medium_to_high_rule = "high only after documented medium reasoning inadequacy"
xhigh_max_ultra_rule = "explicit user request plus current runtime support only"
implementation_rule = "specialist remains read-only; existing assigned writer implements and validates"
evidence_required_fields = ["gate_path", "insufficiency_evidence", "bounded_subproblem", "invocation", "model_effort", "availability", "read_only_enforcement", "output_adoption"]

[route_ledger]
template_path = "codex-home/templates/route-ledger.md"
participant_statuses = ["adopted", "superseded", "failed", "blocked", "timeout", "closed", "ignored", "review-only"]
require_auditable_child_output_summary = true
require_execution_context_discovery_section = true
require_evidence_source_section = true
require_goal_handoff_status_section = true
require_main_session_substitution_section = true
require_voice_sidecar_section = true
require_reuse_gate_section = true
require_spawn_budget_section = true
require_exceptional_reasoning_gate_section = true
participant_required_fields = ["id", "parent_id", "thread_source", "evidence_source", "role", "model_evidence", "status", "adopted", "reason", "reuse_checked", "scope_key", "acceptance_matrix_id", "batch_id", "spawn_reason", "reuse_or_spawn_decision", "supersedes_child_id"]

[lifecycle_policy]
require_reuse_gate_before_spawn = true
pool_reuse_key_fields = ["parent_route_id", "role", "scope_key", "acceptance_matrix_id", "batch_id"]
prefer_send_input_for_narrow_rework = true
prefer_send_input_for_reviewer_closure = true
new_spawn_requires_reason = true
respect_user_requested_agent_count_as_cap = true
t2_t3_default_child_budget = 3
# Planner + one writer + final reviewer; optional discovery needs an expansion packet.
max_same_role_per_scope_without_expansion = 1
require_budget_expansion_packet = true
placeholder_or_missent_child_status = "ignored"
placeholder_or_missent_child_reason = "pollution"
placeholder_or_missent_counts_as_route_evidence = false

[writer_policy]
single_active_writer_per_scope = true
require_writer_replacement_packet = true
require_main_session_substitution_packet = true
replacement_reasons = ["failed", "blocked", "timeout", "abandoned", "output_unavailable", "output_unusable", "closed_with_unusable_output"]
main_session_substitution_reasons = ["blocked", "timeout", "closed_with_unusable_output"]
main_session_substitution_required_fields = ["original_worker_id", "blocking_reason", "reusable_output", "main_session_write_scope", "validation_commands", "reviewer_closure"]
allow_nonconflicting_parallel_while_waiting = true
prohibit_impatient_high_worker_replacement = true
max_parallel_high_writers_per_scope = 1

[review_policy]
require_same_reviewer_for_high_severity_rework_when_possible = true
require_reviewer_identity_stickiness = true
prefer_send_input_for_reviewer_closure = true
new_reviewer_requires_reason = true
max_reviewers_per_acceptance_matrix_without_expansion = 2
# One intermediate risk reviewer plus one mandatory final reviewer when the tier requires both.
allow_single_narrow_rework_pass = true
require_closure_note_when_reviewer_cannot_rerun = true
escalate_after_expanded_rework = true

[explorer_policy]
max_explorers_default = 4
respect_user_requested_agent_count_as_cap = true
fanout_requires_coverage_matrix = true
fanout_requires_lens_per_explorer = true
fanout_requires_stop_condition = true
require_budget_expansion_packet = true

[tier_t4]
final_reviewer = "reviewer_final"
require_milestone_packets = true
prefer_planner_first = true
preferred_planner = "planner_frontier"
default_milestone_worker = "worker_frontier"
allow_batch_worker_for_low_risk_mechanical_milestones = false
allow_batch_worker_for_separately_scored_trivial_subtasks = true
batch_subtask_rule = "Only separately scored T0/T1 trivial deterministic execution under a T4 parent may use Luna medium; never an entire T4 milestone. Parent retains frontier writer, milestone review and Astra high final review."
batch_worker_requires_availability_gate = true

[agent_limits]
max_threads = 6
max_depth = 1

[sidecar_policy]
voice_tts_failure_affects_task_status = false
voice_tts_failure_affects_route_status = false
voice_tts_failure_status = "sidecar_failure"
voice_tts_failure_note = "Record voice/TTS sidecar failures without changing task, route, validation, or reviewer status."

[economics_policy]
reference = "skills/codex-workflow/references/model-selection-evidence-2026-09.md"
status = "API token prices are comparison proxies only; Codex subscription consumption is not established by API pricing"
family_mapping_assumption = "use exact registered model IDs: GPT-6 Luna, GPT-6.1 Sol, GPT-6 Astra; historical GPT-5.6 profiles are inactive, not automatic fallbacks"
routine_astra_roles = ["planner_frontier", "worker_frontier", "reviewer_frontier", "reviewer_final", "reasoning_specialist"]
specialist_gate_scope = "reasoning_specialist only; routine approved Astra roles, including high boundary roles do not need this gate"
astra_high_rule = "initial planning/final review: mandatory user-authorized high floor; implementation/specialist: documented medium inadequacy; never capacity-driven automatic high"
astra_xhigh_max_ultra_rule = "explicit user request plus runtime support"

[execution_mapping_policy]
compare_registered_model_effort_to_controls = true
selected_profile_precedes_baseline = true
non_default_profile_invocation = "default child with explicit selected model/effort and complete semantic-role instructions; verify runtime mapping and actual enforcement"
stale_registration_fallback = "default child with explicit mapped model and effort, bounded fork/context, full role instructions and acceptance criteria"
require_exact_model_effort_availability = true
require_actual_enforcement_evidence = true
prompt_only_is_hard_isolation = false
route_blocked_if_required_isolation_unavailable = true
fallback_rule = "Record unavailability or unsuitability, chosen safe Sol/Astra fallback and evidence before invocation; no hidden rerouting. No unapproved expensive automatic high."

# Historical Terra profiles remain as inactive files; active automatic fallbacks use Sol low or a safe Astra profile with recorded availability evidence.
