<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc">
  <title id="title">Codex Cost-Aware Semantic Routing Workflow</title>
  <desc id="desc">Economic Luna/Astra role mapping and a separately gated bounded reasoning specialist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.48" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f6fff9"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .title { font-size: 40px; font-weight: 900; fill: url(#titleGrad); }
      .subtitle { font-size: 16px; font-weight: 650; fill: #334155; }
      .section { font-size: 22px; font-weight: 850; fill: #0f172a; }
      .cardTitle { font-size: 17px; font-weight: 850; }
      .line { font-size: 14px; fill: #1f2937; }
      .small { font-size: 12.5px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .pill { font-size: 12px; font-weight: 800; fill: #334155; }
      .badgeText { font-size: 11px; font-weight: 900; fill: #ffffff; }
      .card { filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="1900" fill="url(#bg)"/>

  <text x="64" y="66" class="title">Codex 成本感知语义路由工作流</text>
  <text x="64" y="102" class="subtitle">常规角色按用户经验表选用 Luna / Astra；reasoning_specialist 保留独立只读 gate。</text>
  <text x="64" y="130" class="small">模型映射集中在 routing-controls.toml；旧 5.4/5.5 角色文件只作为 transition-only compatibility。</text>

  <rect x="1016" y="42" width="520" height="112" rx="16" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="1042" y="76" class="cardTitle" fill="#15803d">当前根默认</text>
  <text x="1042" y="104" class="line">root_direct：gpt-5.6-sol / medium</text>
  <text x="1042" y="128" class="line">根默认不变；常规 Astra low / medium 已启用</text>

  <rect x="64" y="178" width="1472" height="180" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" class="card"/>
  <text x="92" y="216" class="section">0. 预路由</text>

  <rect x="92" y="244" width="320" height="84" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="118" y="272" class="cardTitle" fill="#334155">用户输入需求</text>
  <text x="118" y="298" class="line">Bug / config / review / migration / step</text>
  <text x="118" y="318" class="small">收集风险、范围、验证路径</text>

  <line x1="412" y1="286" x2="484" y2="286" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="484" y="244" width="320" height="84" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="510" y="272" class="cardTitle" fill="#2563eb">静态确定性分层</text>
  <text x="510" y="298" class="line">先判断 T0-T4，不先耗费子代</text>
  <text x="510" y="318" class="small">T2 记录 compact evidence</text>

  <line x1="804" y1="286" x2="876" y2="286" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="876" y="244" width="320" height="84" rx="14" fill="#ffffff" stroke="#fed7aa"/>
  <text x="902" y="272" class="cardTitle" fill="#ea580c">按需探索</text>
  <text x="902" y="298" class="line">explorer：Luna / high，只读</text>
  <text x="902" y="318" class="small">只在范围或验证不清时使用</text>

  <line x1="1196" y1="286" x2="1268" y2="286" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="1268" y="244" width="240" height="84" rx="14" fill="#ffffff" stroke="#86efac"/>
  <text x="1294" y="272" class="cardTitle" fill="#15803d">进入 Tier</text>
  <text x="1294" y="298" class="line">单 writer</text>
  <text x="1294" y="318" class="small">先验证，再评审</text>

  <text x="64" y="418" class="section">1. Tier 路由卡片</text>

  <rect x="64" y="448" width="270" height="354" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" class="card"/>
  <text x="92" y="484" class="cardTitle" fill="#15803d">T0 简单任务</text>
  <text x="92" y="518" class="line">适用：typo / import / 单文件小修</text>
  <text x="92" y="544" class="line">执行：root_direct</text>
  <text x="92" y="570" class="line">模型：Sol / medium</text>
  <rect x="92" y="612" width="214" height="82" rx="12" fill="#ffffff" stroke="#86efac"/>
  <text x="112" y="642" class="small">focused validation</text>
  <text x="112" y="666" class="small">通常直接返回</text>
  <text x="112" y="688" class="small">不自动创建子代</text>
  <circle cx="292" cy="762" r="16" fill="#16a34a"/>
  <text x="292" y="766" text-anchor="middle" class="badgeText">OK</text>

  <rect x="366" y="448" width="270" height="354" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" class="card"/>
  <text x="394" y="484" class="cardTitle" fill="#2563eb">T1 局部但非简单</text>
  <text x="394" y="518" class="line">适用：局部 bug / 小功能</text>
  <text x="394" y="544" class="line">执行：root_direct</text>
  <text x="394" y="570" class="line">模型：Sol / medium</text>
  <rect x="394" y="612" width="214" height="82" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <text x="414" y="642" class="small">不自动 reviewer</text>
  <text x="414" y="666" class="small">风险升高则重判为 T2/T3</text>
  <text x="414" y="688" class="small">验证后返回</text>
  <circle cx="594" cy="762" r="16" fill="#2563eb"/>
  <text x="594" y="766" text-anchor="middle" class="badgeText">OK</text>

  <rect x="668" y="448" width="270" height="354" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2" class="card"/>
  <text x="696" y="484" class="cardTitle" fill="#ea580c">T2 管理式条件路由</text>
  <text x="696" y="518" class="line">适用：范围不清 / 配置 / 多文件</text>
  <text x="696" y="544" class="line">默认：worker_standard</text>
  <text x="696" y="570" class="line">模型：Luna / xhigh</text>
  <rect x="696" y="612" width="214" height="98" rx="12" fill="#ffffff" stroke="#fdba74"/>
  <text x="716" y="642" class="small">可选 explorer</text>
  <text x="716" y="666" class="small">必要时 reviewer_risk</text>
  <text x="716" y="690" class="small">记录 compact evidence</text>
  <circle cx="896" cy="762" r="16" fill="#ea580c"/>
  <text x="896" y="766" text-anchor="middle" class="badgeText">E1</text>

  <rect x="970" y="448" width="270" height="354" rx="18" fill="#fff1f2" stroke="#fb7185" stroke-width="2" class="card"/>
  <text x="998" y="484" class="cardTitle" fill="#be123c">T3 高风险任务</text>
  <text x="998" y="518" class="line">适用：安全 / 权限 / 数据 / 契约</text>
  <text x="998" y="544" class="line">硬路由：explorer -> worker_frontier</text>
  <text x="998" y="570" class="line">评审：reviewer_risk</text>
  <rect x="998" y="612" width="214" height="98" rx="12" fill="#ffffff" stroke="#fda4af"/>
  <text x="1018" y="642" class="small">worker_frontier：Astra / low</text>
  <text x="1018" y="666" class="small">reviewer_risk：Astra / low</text>
  <text x="1018" y="690" class="small">无子上下文则 route_blocked</text>
  <circle cx="1198" cy="762" r="16" fill="#be123c"/>
  <text x="1198" y="766" text-anchor="middle" class="badgeText">E2</text>

  <rect x="1272" y="448" width="264" height="354" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2" class="card"/>
  <text x="1300" y="484" class="cardTitle" fill="#dc2626">T4 规划 / 迁移 / 多阶段</text>
  <text x="1300" y="518" class="line">规划：planner_frontier</text>
  <text x="1300" y="544" class="line">执行：staged worker_frontier</text>
  <text x="1300" y="570" class="line">最终：reviewer_final</text>
  <rect x="1300" y="612" width="208" height="98" rx="12" fill="#ffffff" stroke="#fca5a5"/>
  <text x="1320" y="642" class="small">规划/终审：Astra / medium</text>
  <text x="1320" y="666" class="small">里程碑 reviewer_risk</text>
  <text x="1320" y="690" class="small">必须有 milestone packet</text>
  <circle cx="1494" cy="762" r="16" fill="#dc2626"/>
  <text x="1494" y="766" text-anchor="middle" class="badgeText">E3</text>

  <line x1="199" y1="802" x2="199" y2="844" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="501" y1="802" x2="501" y2="844" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="803" y1="802" x2="803" y2="844" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1105" y1="802" x2="1105" y2="844" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1404" y1="802" x2="1404" y2="844" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="64" y="844" width="1472" height="260" rx="22" fill="#faf5ff" stroke="#a855f7" stroke-width="2" class="card"/>
  <text x="92" y="882" class="section">2. 证据与评审</text>
  <text x="92" y="920" class="line">T0/T1：根线程直接完成，记录验证结果和风险，不自动派生子代。</text>
  <text x="92" y="950" class="line">T2：compact evidence 必填：决策、子代 id 如有、模型来源、验证、frontier capability 是否触发。</text>
  <text x="92" y="980" class="line">T3/T4：完整 route ledger；Execution Context Discovery；缺工具/模型则 route_blocked。</text>
  <text x="770" y="920" class="line">Reviewer 只看目标、验收标准、diff、验证结果和必要关键文件。</text>
  <text x="770" y="950" class="line">评审发现高严重问题：同一 worker 窄返工一次；扩大则 Failure Packet。</text>
  <text x="770" y="980" class="line">Reviewer Stickiness：同一 acceptance matrix 尽量由同一 reviewer 闭环。</text>
  <rect x="92" y="1022" width="610" height="44" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="112" y="1049" class="pill">transition-only 旧角色文件保留兼容，但不进入新 active defaults</text>
  <rect x="730" y="1014" width="778" height="60" rx="10" fill="#ffffff" stroke="#c084fc"/>
  <text x="750" y="1038" class="pill">specialist gate：超高难且当前路线不足，或 failure packet 证明推理上限</text>
  <text x="750" y="1060" class="small">T3/T4、风险、文件数、高置信度、capacity 均不能单独触发；原 writer 保留</text>

  <rect x="64" y="1142" width="1472" height="242" rx="22" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2" class="card"/>
  <text x="92" y="1180" class="section">3. 语义角色矩阵</text>

  <rect x="92" y="1214" width="190" height="118" rx="14" fill="#ffffff" stroke="#bae6fd"/>
  <text x="116" y="1244" class="cardTitle" fill="#0369a1">batch_worker</text>
  <text x="116" y="1270" class="line">Luna / low</text>
  <text x="116" y="1294" class="small">availability gate</text>
  <text x="116" y="1316" class="small">fallback: worker_standard</text>

  <rect x="314" y="1214" width="190" height="118" rx="14" fill="#ffffff" stroke="#bae6fd"/>
  <text x="338" y="1244" class="cardTitle" fill="#0369a1">explorer</text>
  <text x="338" y="1270" class="line">Luna / high</text>
  <text x="338" y="1294" class="small">read-only</text>
  <text x="338" y="1316" class="small">targeted discovery</text>

  <rect x="536" y="1214" width="190" height="118" rx="14" fill="#ffffff" stroke="#bae6fd"/>
  <text x="560" y="1244" class="cardTitle" fill="#0369a1">worker_standard</text>
  <text x="560" y="1270" class="line">Luna / xhigh</text>
  <text x="560" y="1294" class="small">default T2 writer</text>
  <text x="560" y="1316" class="small">completion-first</text>

  <rect x="758" y="1214" width="190" height="118" rx="14" fill="#ffffff" stroke="#fecaca"/>
  <text x="782" y="1244" class="cardTitle" fill="#b91c1c">worker_frontier</text>
  <text x="782" y="1270" class="line">Astra / low</text>
  <text x="782" y="1294" class="small">T2 escalation</text>
  <text x="782" y="1316" class="small">T3/T4 work</text>

  <rect x="980" y="1214" width="190" height="118" rx="14" fill="#ffffff" stroke="#fecaca"/>
  <text x="1004" y="1244" class="cardTitle" fill="#b91c1c">reviewer_risk</text>
  <text x="1004" y="1270" class="line">Astra / low</text>
  <text x="1004" y="1294" class="small">risk review</text>
  <text x="1004" y="1316" class="small">validate-before-review</text>

  <rect x="1202" y="1214" width="306" height="118" rx="14" fill="#ffffff" stroke="#fca5a5"/>
  <text x="1226" y="1244" class="cardTitle" fill="#dc2626">planner_frontier / reviewer_final</text>
  <text x="1226" y="1270" class="line">Astra / medium</text>
  <text x="1226" y="1294" class="small">T4 planning and final cross-milestone closure</text>
  <text x="1226" y="1316" class="small">not root default</text>
  <rect x="314" y="1342" width="894" height="32" rx="10" fill="#faf5ff" stroke="#c084fc"/>
  <text x="334" y="1363" class="pill">reasoning_specialist：GPT-6 Astra / medium；read-only；exceptional gate only；existing writer implements</text>

  <rect x="64" y="1422" width="1472" height="250" rx="22" fill="#fff7f7" stroke="#ef4444" stroke-width="2" class="card"/>
  <text x="92" y="1460" class="section">4. 异常与失败处理</text>
  <text x="92" y="1490" class="small">异常路径通过 E1-E5 编号引用，不用长线穿越主图。</text>

  <rect x="92" y="1522" width="260" height="118" rx="14" fill="#ffffff" stroke="#fdba74"/>
  <text x="116" y="1552" class="cardTitle" fill="#c2410c">E1 T2 能力升级</text>
  <text x="116" y="1578" class="line">安全 / 数据 / 迁移 / 契约</text>
  <text x="116" y="1602" class="line">下层失败或跨模块不确定</text>
  <text x="116" y="1626" class="small">升级 worker_frontier</text>

  <rect x="382" y="1522" width="260" height="118" rx="14" fill="#ffffff" stroke="#fca5a5"/>
  <text x="406" y="1552" class="cardTitle" fill="#b91c1c">E2 route_blocked</text>
  <text x="406" y="1578" class="line">T3/T4 缺子上下文 / 模型</text>
  <text x="406" y="1602" class="line">停止实现，不伪造路由</text>
  <text x="406" y="1626" class="small">说明缺什么和如何恢复</text>

  <rect x="672" y="1522" width="260" height="118" rx="14" fill="#ffffff" stroke="#fbbf24"/>
  <text x="696" y="1552" class="cardTitle" fill="#a16207">E3 model_capacity</text>
  <text x="696" y="1578" class="line">模型满载不算代码失败</text>
  <text x="696" y="1602" class="line">记录 capacity note</text>
  <text x="696" y="1626" class="small">切最近安全 fallback；不自动提高 Astra effort</text>

  <rect x="962" y="1522" width="260" height="118" rx="14" fill="#ffffff" stroke="#f0abfc"/>
  <text x="986" y="1552" class="cardTitle" fill="#a21caf">E4 writer failed</text>
  <text x="986" y="1578" class="line">关闭旧状态</text>
  <text x="986" y="1602" class="line">记录 replacement packet</text>
  <text x="986" y="1626" class="small">同 scope 只允许一个 writer</text>

  <rect x="1252" y="1522" width="256" height="118" rx="14" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1276" y="1552" class="cardTitle" fill="#1d4ed8">E5 drift risk</text>
  <text x="1276" y="1578" class="line">图、skill、routing-controls</text>
  <text x="1276" y="1602" class="line">模板和 WORK_MEMORY 同步</text>
  <text x="1276" y="1626" class="small">旧角色只在兼容说明出现</text>

  <rect x="64" y="1710" width="1472" height="128" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" class="card"/>
  <text x="92" y="1748" class="section">5. 治理护栏</text>
  <text x="92" y="1782" class="line">max_depth = 1；单写入者；validate-before-review；failure packet；Reuse Gate；Spawn Budget；Reviewer Stickiness；Explorer Fanout Cap。</text>
  <text x="92" y="1812" class="line">全局同步必须等 reviewer 明确 `OK to sync`；本项目先作为 source of truth 更新，历史 transcripts / old ledgers / pricing reports 不改。</text>
</svg>
